name: Weekly ToDo

on:
  schedule:
    # 毎週月曜 9:00 JST (= 月曜 0:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly ToDo issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y/%m/%d)
          gh issue create \
            --title "次回のお題を決める ($DATE)" \
            --body "毎週自動作成されるToDoです。"
